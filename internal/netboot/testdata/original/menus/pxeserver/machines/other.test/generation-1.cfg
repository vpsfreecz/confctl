MENU TITLE other.test (1 - current - 012345678 - 6.6.52)

LABEL default
  MENU LABEL Default runlevel
  LINUX boot/other.test/1/bzImage
  INITRD boot/other.test/1/initrd
  APPEND httproot=http://netboot.test/other.test/1/root.squashfs console=ttyS0 runlevel=default

LABEL nopools
  MENU LABEL Default runlevel without container imports
  LINUX boot/other.test/1/bzImage
  INITRD boot/other.test/1/initrd
  APPEND httproot=http://netboot.test/other.test/1/root.squashfs console=ttyS0 runlevel=default osctl.pools=0

LABEL nostart
  MENU LABEL Default runlevel without container autostart
  LINUX boot/other.test/1/bzImage
  INITRD boot/other.test/1/initrd
  APPEND httproot=http://netboot.test/other.test/1/root.squashfs console=ttyS0 runlevel=default osctl.autostart=0

LABEL rescue
  MENU LABEL Rescue runlevel (network and sshd)
  LINUX boot/other.test/1/bzImage
  INITRD boot/other.test/1/initrd
  APPEND httproot=http://netboot.test/other.test/1/root.squashfs console=ttyS0 runlevel=rescue

LABEL single
  MENU LABEL Single-user runlevel (console only)
  LINUX boot/other.test/1/bzImage
  INITRD boot/other.test/1/initrd
  APPEND httproot=http://netboot.test/other.test/1/root.squashfs console=ttyS0 runlevel=single

LABEL other.test-generations
  MENU LABEL < Back to Generations
  KERNEL menu.c32
  APPEND pxeserver/machines/other.test/generations.cfg

LABEL memtest
  MENU LABEL Memtest86
  LINUX boot/memtest86/memtest.bin
  APPEND console=ttyS0 fixture-param

LABEL mainmenu
  MENU LABEL < Back to Main Menu
  KERNEL menu.c32
  APPEND pxelinux.cfg/default
