name: Rust

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Check fixture tools and compile-time login entry
        shell: bash
        run: |
          set -euo pipefail
          for tool in git python3 cc cmake cat sleep logname bash; do
            command -v "$tool" >/dev/null || { echo "Missing fixture tool: $tool" >&2; exit 1; }
          done
          logname_entry="$(command -v logname)"
          case "$logname_entry" in
            /*) test -x "$logname_entry" ;;
            *) echo "logname must resolve to an absolute executable entry" >&2; exit 1 ;;
          esac
          printf 'CONFCTL_LOGNAME=%s\n' "$logname_entry" >> "$GITHUB_ENV"

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Check all Rust targets and features
        run: cargo check --workspace --all-targets --all-features --locked

      - name: Run strict Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Check pure reference maintenance
        run: |
          cargo test --locked --example generate-reference
          cargo run --locked --example generate-reference -- cli --check man/man8/confctl-reference.8.md

      - name: Run default Rust tests
        run: cargo test --workspace --locked

  package:
    name: Native package (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
        with:
          enable_kvm: false
          extra_nix_config: |
            accept-flake-config = false
            allow-import-from-derivation = false

      - name: Qualify and inspect native runtime package
        shell: bash
        env:
          PACKAGE_SYSTEM: ${{ matrix.system }}
        run: |
          bash .github/scripts/qualify-package.sh "$PACKAGE_SYSTEM"
